<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روتيني الأسبوعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FC;--surf:#fff;--ink:#1F2937;--mut:#6B7280;--line:#E5E7EB;--navy:#1E2A4A;
--code:#2563EB;--study:#7C3AED;--lesson:#16A34A;--kuttab:#0D9488;--gym:#EA580C;--sleep:#5B6CAF;--rest:#6B7280;--transport:#9CA3AF;--bad:#DC2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1524;--surf:#182033;--ink:#E8ECF5;--mut:#98A2B8;--line:#2A3550;--navy:#E8ECF5;--code:#6B9BFF;--study:#A78BFA;--lesson:#4ADE80;--kuttab:#2DD4BF;--gym:#FB923C;--sleep:#8FA0E6;--rest:#9AA3B5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1524;--surf:#182033;--ink:#E8ECF5;--mut:#98A2B8;--line:#2A3550;--navy:#E8ECF5;--code:#6B9BFF;--study:#A78BFA;--lesson:#4ADE80;--kuttab:#2DD4BF;--gym:#FB923C;--sleep:#8FA0E6;--rest:#9AA3B5}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,'Noto Sans Arabic',Tahoma,sans-serif;line-height:1.5;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:30px;font-weight:800;color:var(--navy)}
.sub{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font-family:inherit;font-size:14px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:7px 13px;font-weight:700;cursor:pointer}
.btn.on{background:var(--code);color:#fff;border-color:var(--code)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--code);outline-offset:2px}
.tabs{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font-weight:700;color:var(--mut);cursor:pointer}
.tab.on{background:var(--navy);color:var(--bg)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.day{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:7px 14px;font-weight:700;cursor:pointer}
.day.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.dh h2{margin:0;font-size:28px;font-weight:800;color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surf));color:var(--c)}
.row{--c:var(--rest);display:grid;grid-template-columns:104px minmax(120px,190px) 1fr;gap:8px;align-items:center;margin-bottom:7px;padding:8px 12px;border-radius:12px;border-inline-start:6px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surf))}
.row.code{--c:var(--code)}.row.study{--c:var(--study)}.row.lesson{--c:var(--lesson)}.row.kuttab{--c:var(--kuttab)}.row.gym{--c:var(--gym)}.row.sleep{--c:var(--sleep)}.row.transport{--c:var(--transport);padding-top:4px;padding-bottom:4px;opacity:.85}
.row.bad{outline:2px solid var(--bad)}
.tm{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.rng{display:inline-flex;direction:ltr;unicode-bidi:isolate;gap:5px;font-weight:800}
.tm small{font-size:11px;color:var(--mut);font-weight:600}
.act{font-weight:700;color:var(--c);display:flex;gap:8px;align-items:center}
.det{font-size:13px;color:var(--mut)}
.warn{color:var(--bad);font-size:12px;font-weight:700}
.row.ed{grid-template-columns:1fr 1fr 1fr 1fr;grid-auto-flow:row}
.row.ed input,.row.ed select{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--surf);min-width:0}
.row.ed .w2{grid-column:span 2}.row.ed .w4{grid-column:span 4}
.del{border:0;background:none;color:var(--bad);font-weight:700;cursor:pointer;justify-self:end}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12px;color:var(--mut);font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.card{--c:var(--rest);display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border-inline-start:6px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surf))}
.card .ic{font-size:26px;background:var(--surf);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.card b{color:var(--c);display:block}.card span{font-weight:700}.card small{display:block;color:var(--mut)}
h3{font-size:18px;color:var(--navy);margin:18px 0 8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{background:var(--navy);color:var(--bg);text-align:right;padding:9px 12px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.d{font-weight:800;color:var(--navy);white-space:nowrap}
.note{margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--mut);font-size:13px}
.hide{display:none}
@media (max-width:560px){.row{grid-template-columns:88px 1fr}.row .det{grid-column:1/-1}h1{font-size:25px}.row.ed{grid-template-columns:1fr 1fr}.row.ed .w4{grid-column:span 2}}
.row.ck{grid-template-columns:30px 104px minmax(120px,190px) 1fr}
.cbw{display:flex;align-items:center;justify-content:center;cursor:pointer}
.cb,input[type=checkbox]{width:22px;height:22px;accent-color:var(--c);margin:0;cursor:pointer}
input[type=checkbox]:disabled{cursor:default;opacity:.75}
.row.done .act span:not(.nowb),.row.done .det{text-decoration:line-through;opacity:.55}
.row.now{box-shadow:0 0 0 2px var(--c)}
.nowb{font-size:11px;background:var(--c);color:var(--bg);border-radius:99px;padding:0 9px}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.prog b{display:block;color:var(--navy)}.prog span{font-size:12px;color:var(--mut)}
.prog i{flex:1;min-width:140px;height:10px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--lesson);border-radius:99px;transition:width .3s}
.note.lock{margin:0 0 10px}
@media (max-width:560px){.row.ck{grid-template-columns:30px 88px 1fr}}
@media print{body{background:#fff}.tools,.tabs,.days,.add,.del{display:none!important}.wrap{padding:0}.row{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

const ls=sorted(d).filter(r=>r.t=="lesson").map(r=>esc(r.n.split(" — ")[0])+" "+d12(r.a)+"–"+d12(r.b)).join(" • ")||"—";

return`<tr><td class="d">${d}</td><td><div class="chips">${chipH(d)}</div></td><td>${ls}</td><td>${esc(st)}</td></tr>`}).join("")+"</tbody></table></div>";
return h+'<div class="note">كل الأرقام هنا بتتحسب من الجدول اليومي — عدّل أي نشاط من تبويب «الأيام» والملخص يتغير لوحده.</div>'+legend()}
function lesView(){
let rows="";DAYS.forEach(d=>sorted(d).filter(r=>r.t=="lesson").forEach(r=>rows+=`<tr><td class="d">${d}</td><td style="color:var(--lesson);font-weight:800">${esc(r.n.split(" — ")[0])}</td><td>${rng([d12(r.a),"–",d12(r.b)])} ${per(r.a,r.b)}</td><td>${esc(r.d)}</td></tr>`));
const ks=DAYS.filter(d=>S[d].some(r=>r.t=="kuttab"&&!/قرآن/.test(r.n)));
return'<h3>📚 جدول الدروس الأسبوعي</h3><div class="tw"><table><thead><tr><th>اليوم</th><th>الدرس</th><th>الوقت</th><th>تفاصيل</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+(ks.length?`<div class="grid" style="margin-top:14px">${card("kuttab","📖","الكُتّاب — التزام ثابت",ks[0]+" – "+ks[ks.length-1],"11:00 صباحًا – 1:00 ظهرًا")}</div>`:"")}
function stuView(){
let rows="";DAYS.forEach(d=>{const s=sorted(d).filter(r=>r.t=="study");rows+=`<tr><td class="d">${d}</td><td>${s.map(r=>`<div style="color:var(--study);font-weight:800">${esc(r.n)}</div><div class="det">${esc(r.d)}</div>`).join("")||"—"}</td><td>${s.map(r=>`<div>${rng([d12(r.a),"–",d12(r.b)])}</div>`).join("")}</td></tr>`});
const cnt={};DAYS.forEach(d=>S[d].filter(r=>r.t=="study").forEach(r=>cnt[r.n]=(cnt[r.n]||0)+1));
return'<h3>📖 خطة المذاكرة الأسبوعية</h3><div class="tw"><table><thead><tr><th>اليوم</th><th>المادة ونوع المذاكرة</th><th>الوقت</th></tr></thead><tbody>'+rows+"</tbody></table></div><h3>توزيع الجلسات</h3><div class=\"chips\">"+Object.entries(cnt).map(([k,v])=>`<span class="chip" style="--c:var(--study)">${esc(k)}: ${v} جلسات</span>`).join("")+"</div>"}
function render(){
$("#tabs").innerHTML=TABS.map(([k,v])=>`<button class="tab ${k==tab?"on":""}" data-t="${k}">${v}</button>`).join("");
$("#view").innerHTML=({sum:sumView,day:dayView,les:lesView,stu:stuView})[tab]();
$("#edit").className="btn"+(editing?" on":"");$("#edit").textContent=editing?"✅ تم":"✏️ تعديل"}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-d],[data-del],#add,#edit,#print,#reset");if(!t)return;
if(t.dataset.t){tab=t.dataset.t;if(tab!="day")editing=false}
else if(t.dataset.d)day=t.dataset.d;
else if(t.dataset.del!==undefined){S[day].splice(+t.dataset.del,1);save()}
else if(t.id=="add"){const l=sorted(day).slice(-1)[0];S[day].push({id:"n"+Date.now(),a:l?l.a:"08:00",b:null,t:"rest",i2:"🛋️",n:"نشاط جديد",d:""});save()}
else if(t.id=="edit"){editing=!editing;tab="day"}
else if(t.id=="print"){window.print();return}
else if(t.id=="reset"){if(!confirm("هترجع الجدول الأصلي وكل تعديلاتك هتتمسح. متأكد؟"))return;S=JSON.parse(JSON.stringify(DEF));save()}
render()});
document.addEventListener("input",e=>{const r=e.target.closest(".row.ed");if(!r)return;const f=e.target.dataset.f;let v=e.target.value;if(f=="b"&&!v)v=null;S[day][+r.dataset.i][f]=v;save()});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.ck;if(k){if(day!==now().day){render();return}(C.done[day]=C.done[day]||{})[k]=e.target.checked;saveC();render();return}if(e.target.closest(".row.ed"))render()});
function tick(){const n=now();if(C.w!==n.week)C=loadC();if(n.day!==lastDay){lastDay=n.day;day=n.day}const a=document.activeElement;if(!editing&&!(a&&a.matches&&a.matches("input,select")))render()}
setInterval(tick,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
render();
</script>
</body>
</html>
